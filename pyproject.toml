[project]
name = "bird-climb"
version = "0.1.0"
description = "Hill-climbing on BIRD text-to-SQL dev set"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.74",
    "tqdm",
    "pydantic>=2",
    "sqlglot>=25",
]

[project.optional-dependencies]
# Installed only when running SFT locally (e.g. for tooling/notebooks).
# The Modal training image pins its own copies — these are for editor type
# checking and offline experimentation, not for the GPU container.
sft = [
    "torch>=2.5",
    "transformers>=5.8",
    "unsloth",
    "trl",
    "datasets",
    "peft",
    "accelerate",
    "bitsandbytes",
]

[tool.setuptools.packages.find]
include = ["bird*", "sft*"]

[tool.ruff]
line-length = 100
target-version = "py311"
